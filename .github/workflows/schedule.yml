name: Bale Groups Automation

on:
  schedule:
    - cron: '30 6 * * *'
    - cron: '30 8 * * 2,5'
    - cron: '30 10 * * 2,5'
    - cron: '30 12 * * 2,5'
  workflow_dispatch: 

jobs:
  run-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Execute Script
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          CRON_SCHEDULE: ${{ github.event.schedule }}
        run: python main.py
