name: Bale Groups Automation

on:
  schedule:
    # ارسال حدیث: شنبه و چهارشنبه ساعت ۱۰ صبح ایران (۰۶:۳۰ به وقت جهانی)
    - cron: '30 6 * * 3,6'
    
    # ارسال یادآوری‌ها: شنبه‌ها ساعت ۱۲ ظهر ایران (۰۸:۳۰ به وقت جهانی)
    - cron: '30 8 * * 6'
    
  workflow_dispatch: 

jobs:
  run-automation:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Execute Script
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          CRON_SCHEDULE: ${{ github.event.schedule }}
        run: python main.py

      - name: Commit and Push History
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          touch hadith_history.txt
          git add hadith_history.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "Update hadith history"
          git push
